name: publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Caption ref to publish now (e.g. P01-IG). Empty = everything due."
        required: false
      go:
        description: "Actually publish (otherwise dry run)"
        type: boolean
        default: false
  # Owner approved the launch on 2026-10-19.
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/publisher/public
        run: |
          GO=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.go }}" = "true" ]; then GO="--go"; fi
          if [ -n "${{ inputs.ref }}" ]; then
            node publisher/post.mjs --ref "${{ inputs.ref }}" $GO
          else
            node publisher/post.mjs --due $GO
          fi
      - name: Record published items
        if: always()
        run: |
          if [ -n "$(git status --porcelain publisher/published.json)" ]; then
            git config user.name "motqin-publisher"
            git config user.email "actions@users.noreply.github.com"
            git add publisher/published.json
            git commit -m "publish log"
            git push
          fi
